[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "besig"
version = "1.0.0"
description = "BE-sig: Building Energy signature Toolkit — 변곡점 회귀(CPM) 기반 건물 에너지 분석"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Deukwoo Kim", email = "deukwookim@kict.re.kr" }]
keywords = ["building-energy", "change-point-model", "energy-signature", "ashrae"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Korean",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "openpyxl>=3.1"]

[project.scripts]
besig = "besig.cli:main"

[project.urls]
Homepage = "https://github.com/brainwt/Building-Energy-Signature-aka-CPM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
